plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.mushamusha.horizontalcamera'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.mushamusha.horizontalcamera'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply from: 'https://raw.githubusercontent.com/mushamusha8181/light/main/design-system/mushin-glass.gradle'
