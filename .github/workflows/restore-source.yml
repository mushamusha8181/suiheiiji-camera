name: Restore exact source

on:
  push:
    branches: [ main ]
    paths:
      - '.source_chunks/**'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .source_chunks -maxdepth 1 -name '[0-9][0-9][0-9].b64' | wc -l | tr -d ' ')
          if [ "$count" -lt 19 ]; then
            echo "Waiting for all source chunks: $count/19"
            exit 0
          fi
          cat $(find .source_chunks -maxdepth 1 -name '[0-9][0-9][0-9].b64' | sort) | base64 -d > /tmp/source.zip
          echo '7ee0a2663b905ceee98d570b7c841a4662804bbdad301ef407291947e6fa5e62  /tmp/source.zip' | sha256sum -c -
          rm -rf /tmp/source && mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          src=$(find /tmp/source -mindepth 1 -maxdepth 1 -type d | head -n 1)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .source_chunks -exec rm -rf {} +
          cp -a "$src"/. .
          rm -rf .source_chunks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import 水平維持カメラ v1.7.0 exact source'
          git push origin HEAD:main
